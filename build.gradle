plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}

version = project.mod_version
group = project.maven_group
base.archivesName = 'mutantmore'

repositories {
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Keeps the original Forge-style config files (mutantmore/*.toml)
    implementation "maven.modrinth:forge-config-api-port:${forge_config_api_port_version}"
    compileOnly "com.electronwill.night-config:core:3.8.4"
    compileOnly "com.electronwill.night-config:toml:3.8.4"
}

loom {
    accessWidenerPath = file('src/main/resources/mutantmore.accesswidener')
}

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '10000']
}
